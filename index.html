rimarily with skin, hair, and general anti-aging support, with the other peptides contributing broader tissue-repair properties.",GH:"Somatropin \u2014 recombinant human growth hormone, structurally identical to the growth hormone your body produces naturally. Medically used to treat growth hormone deficiency. In performance and longevity contexts, interest centers on its effects on body composition, recovery, and stimulation of IGF-1.",Testosterone:"The primary male sex hormone, medically used for hypogonadism and testosterone replacement therapy. Its anabolic effects on muscle mass and strength underlie its use in performance contexts, alongside its broader roles in libido, mood, bone density, and red blood cell production.",Reta:"Retatrutide \u2014 an investigational triple agonist acting on GLP-1, GIP, and glucagon receptors, currently in clinical trials for obesity and weight management. It's in the same broad drug family as semaglutide and tirzepatide but targets a third receptor, and has shown substantial weight-loss results in trial data so far.","Slu PP 915":'A lesser-documented research compound related to the SLU-PP family (including SLU-PP-332), which are being studied as "exercise mimetics" \u2014 compounds that activate ERR (estrogen-related receptor) pathways involved in mitochondrial biogenesis and endurance-related adaptations. Public research data on this specific compound is limited.',Vesugen:'One of the Khavinson-style bioregulator peptides, positioned in that research framework as a "vascular bioregulator" targeting blood vessel tissue health. Much of the supporting research comes from Russian bioregulator literature, with limited independent Western clinical validation.',Seltorexant:"A selective orexin-2 receptor antagonist in clinical development, studied particularly for insomnia associated with major depressive disorder. Orexin antagonists work by blocking wake-promoting brain signaling to support sleep onset and maintenance.",Epithalon:"Also called Epitalon \u2014 a synthetic tetrapeptide based on epithalamin, researched by Khavinson for potential effects on telomerase activity and pineal gland function. Positioned in longevity research around anti-aging and circadian/sleep regulation, though robust human clinical trial data remains limited.",Pinealon:"Another Khavinson-style bioregulator peptide, positioned as targeting pineal gland and brain regulatory function within that research framework \u2014 generally associated with cognitive support, sleep/circadian rhythm, and neuroprotection claims.",Bromantane:"A Russian-developed actoprotector with mild psychostimulant and anxiolytic properties. Originally developed for military use to enhance physical endurance and stress resistance without the typical side effects of classic stimulants; also studied for anti-fatigue and mood effects.",Modafinil:"A wakefulness-promoting agent approved for narcolepsy, shift-work sleep disorder, and sleepiness associated with obstructive sleep apnea. Widely used off-label as a cognitive enhancer for alertness, with a different mechanism and side-effect profile than traditional stimulants.",Yohimbine:"An alkaloid from yohimbe tree bark that acts as an alpha-2 adrenergic receptor antagonist. Historically used for erectile dysfunction; in fitness contexts it's more commonly associated with fat-loss support \u2014 particularly stubborn fat \u2014 via increased catecholamine signaling.",Vilon:"A Khavinson dipeptide bioregulator, researched primarily within that framework for immune system modulation alongside general regenerative and anti-aging claims.","Methenolone Enanthate":"Also known as Primobolan \u2014 an anabolic-androgenic steroid recognized for a relatively mild side-effect profile and low estrogenic activity. Historically used medically for muscle-wasting conditions; in performance contexts it's popular for lean muscle retention, especially during cutting phases, due to minimal water retention.","ATX-304":"Also referred to as O-304 \u2014 an experimental AMPK (AMP-activated protein kinase) activator being researched for metabolic effects including insulin sensitivity and mitochondrial function. Still in early research stages, positioned as a potential exercise-mimetic tool for metabolic health.",SANA:"Also referenced as MVD1 \u2014 a lesser-documented research compound with limited public data available. It circulates in some peptide research communities, sometimes discussed in metabolic or mitochondrial research contexts, but solid published information is scarce.",Tirz:"Tirzepatide \u2014 a dual GIP/GLP-1 receptor agonist, approved (as Mounjaro/Zepbound) for type 2 diabetes and chronic weight management. It mimics two incretin hormones to improve insulin secretion, slow gastric emptying, and reduce appetite, producing substantial weight loss in clinical trials.",Clenbuterol:"A beta-2 adrenergic agonist approved in some countries as a veterinary bronchodilator (not approved for human use in the US). Used off-label in bodybuilding and weight-loss contexts for its thermogenic, fat-burning properties, though it carries notable cardiovascular risk considerations.","Doxepin (Silenor)":"A tricyclic antidepressant that, at low doses, is approved specifically for insomnia under the brand name Silenor. At these low doses it works largely through antihistamine effects to support sleep maintenance \u2014 a distinct use from its higher-dose antidepressant role.",Ezetimibe:"A cholesterol-lowering medication that works by blocking intestinal absorption of dietary cholesterol. Often used alongside statins for additional LDL reduction, or as an alternative for people who don't tolerate statins well.",Telmisartan:"An angiotensin II receptor blocker (ARB) approved for high blood pressure. It also acts as a partial PPAR-delta agonist, a property that has drawn separate research interest into potential metabolic and exercise-performance effects beyond its blood pressure use.",Propranolol:"A non-selective beta-blocker used for high blood pressure, arrhythmias, migraine prevention, and performance/situational anxiety. It works by blunting adrenaline's effects on the heart and blood vessels, slowing heart rate and reducing the physical symptoms of a stress response.","Mesterolone (Proviron)":"An oral androgen with minimal anabolic activity relative to its androgenic effects. It's commonly used to support libido and sexual function, and as an anti-estrogenic agent by binding SHBG (freeing up other androgens) \u2014 rather than for muscle-building on its own.",Semax:"A synthetic peptide derived from an ACTH fragment, developed in Russia and researched for nootropic and neuroprotective effects. Commonly associated with focus, memory, and cognitive performance, and studied in stroke-recovery contexts in Russian clinical use.",Selank:"A synthetic peptide analog of tuftsin, also developed in Russia. Researched primarily for anxiolytic (anti-anxiety) effects with mild nootropic benefits, generally without the sedation associated with traditional anti-anxiety medications.","PT-141 (Bremelanotide)":"A melanocortin receptor agonist, approved (as Vyleesi) for hypoactive sexual desire disorder in premenopausal women. It acts centrally on melanocortin pathways involved in sexual arousal \u2014 a different mechanism than PDE5 inhibitors, which act locally on blood vessels.","Mirabegron(YM-178)":'A beta-3 adrenergic receptor agonist, approved (as Myrbetriq) for overactive bladder. Separately, beta-3 agonism has drawn research interest for activating brown adipose tissue ("brown fat") thermogenesis, prompting off-label interest in metabolic and fat-loss research.',"Magnesium Glycinate":"A highly bioavailable, gentle form of magnesium bound to the amino acid glycine. Commonly used for its calming properties, sleep support, and muscle relaxation, with notably less GI upset than other magnesium forms like oxide or citrate."},Z1={};Object.entries(n2).forEach(([a,e])=>{Z1[Wt(a)] e antioxidant that helps protect cell membranes from oxidative damage. Also plays a role in immune function and skin health.","Vitamin A":"A fat-soluble vitamin essential for vision, immune function, and skin health. Found in two forms \u2014 retinoids (animal sources) and carotenoids (plant sources, like beta-carotene) \u2014 with retinoids being more directly usable by the body.","Vitamin B Complex":"A combination of all eight B vitamins (B1, B2, B3, B5, B6, B7, B9, B12), which work together in energy metabolism, nervous system function, and red blood cell production.","Vitamin B12 (Methylcobalamin)":"The methylated, bioactive form of B12, essential for nerve function, red blood cell formation, and DNA synthesis. Often supplemented since B12 is found almost exclusively in animal products, making deficiency common among vegans/vegetarians and older adults.","Vitamin B6 (P5P)":"Pyridoxal-5-phosphate, the active coenzyme form of vitamin B6, involved in amino acid metabolism, neurotransmitter synthesis, and immune function.","Folate (Methylfolate)":"The active, methylated form of folate (vitamin B9), important for DNA synthesis and red blood cell formation. Preferred over synthetic folic acid by some, since it doesn't require conversion by an enzyme that some people process less efficiently.",Biotin:"Also known as vitamin B7, involved in metabolizing fats, carbohydrates, and proteins. Widely marketed for hair, skin, and nail health, though evidence for benefits beyond correcting an actual deficiency is limited.","Niacin (B3)":"A B vitamin involved in energy metabolism and DNA repair. At higher doses, niacin has cholesterol-modifying effects and is associated with a temporary flushing sensation.","Thiamine (B1)":"A B vitamin essential for converting carbohydrates into energy and supporting nerve function. Deficiency is rare in developed countries but can occur with poor diet or heavy alcohol use.","Riboflavin (B2)":"A B vitamin involved in energy production and cellular function. Also acts as an antioxidant and has been studied for migraine prevention at higher doses.","Vitamin K2":"Distinct from vitamin K1 (found in leafy greens), K2 helps activate proteins that direct calcium to bones and teeth rather than soft tissue. Often paired with vitamin D3 supplementation.","Choline Bitartrate":"A basic, cost-effective form of choline, an essential nutrient involved in cell membrane structure, neurotransmitter (acetylcholine) production, and liver function. Less bioavailable for crossing into the brain than forms like Alpha-GPC or CDP-Choline.","Magnesium Glycinate":"A highly bioavailable, gentle form of magnesium bound to the amino acid glycine. Commonly used for its calming properties, sleep support, and muscle relaxation, with notably less GI upset than other magnesium forms like oxide or citrate.","Magnesium Citrate":"A common, well-absorbed form of magnesium. Also has a mild laxative effect at higher doses, which is why it's sometimes used specifically for constipation relief.","Magnesium Threonate":"A form of magnesium specifically studied for its ability to cross the blood-brain barrier, making it of interest for cognitive support and sleep, distinct from forms aimed primarily at muscle or digestive effects.","Magnesium Malate":"Magnesium bound to malic acid, a compound involved in cellular energy production. Sometimes preferred by people focused on energy and muscle function, including in fibromyalgia research.","Zinc Picolinate":"A well-absorbed form of zinc, an essential mineral involved in immune function, wound healing, and hundreds of enzymatic reactions in the body.","Zinc Carnosine":"A compound combining zinc with the amino acid carnosine, researched specifically for its effects on stomach and gut lining integrity, distinct from general zinc supplementation.",Selenium:"A trace mineral and antioxidant component of enzymes that protect cells from oxidative damage, and essential for thyroid hormone metabolism. Needed only in small amounts, since excess intake can be harmful.",Potassium:"An essential electrolyte mineral involved in fluid balance, muscle contraction (including the heart), and nerve signaling. Supplemental doses are typically kept low since high-dose potassium can be dangerous.",Iodine:"An essential trace mineral required for thyroid hormone production. Both deficiency and excess intake can disrupt thyroid function, so supplementation is generally approached carefully.",Copper:"An essential trace mineral involved in iron metabolism, connective tissue formation, and antioxidant enzyme function. Often included alongside zinc supplementation, since high-dose zinc can deplete copper over time.","Chromium Picolinate":"A well-absorbed form of chromium, a trace mineral studied for its role in insulin sensitivity and carbohydrate metabolism.",Boron:"A trace mineral studied for potential roles in bone health, hormone metabolism, and inflammation, though it's not classified as an essential nutrient with an established dietary requirement.",Iron:"An essential mineral required for hemoglobin production and oxygen transport in the blood. Commonly supplemented for diagnosed iron-deficiency anemia; excess iron can be harmful, so supplementation without a documented need isn't generally recommended.",Calcium:"An essential mineral for bone and teeth structure, as well as muscle contraction, nerve signaling, and blood clotting. Often paired with vitamin D3 and K2 for absorption and proper utilization.",Manganese:"A trace mineral involved in bone formation, metabolism, and antioxidant enzyme function. Needed only in small amounts.","Fish Oil":"A source of the omega-3 fatty acids EPA and DHA, associated with cardiovascular, brain, and joint health. One of the most widely used and researched supplements overall.","Krill Oil":"An omega-3 source from krill, containing EPA and DHA bound to phospholipids rather than triglycerides (as in standard fish oil), which some research suggests may improve absorption. Also naturally contains the antioxidant astaxanthin.","Cod Liver Oil":"A traditional omega-3 source that also naturally contains vitamins A and D, distinguishing it from standard fish oil, which typically doesn't include meaningful amounts of those vitamins.","Algae Oil (Vegan Omega-3)":"A plant-based source of DHA and EPA derived from algae (the original source fish get their omega-3s from), used as a vegan/vegetarian alternative to fish oil.","Omega-3-6-9 Blend":"A combination supplement providing omega-3 (anti-inflammatory), omega-6 (common in the diet already), and omega-9 (non-essential but supportive) fatty acids together.","Evening Primrose Oil":"A plant oil rich in gamma-linolenic acid (GLA), an omega-6 fatty acid studied for skin health and hormonal symptom support, particularly around menstrual cycles.","Borage Oil":"Another rich source of GLA, similarly studied for skin health and inflammatory conditions, often used interchangeably with evening primrose oil.","Flaxseed Oil":"A plant-based source of ALA, an omega-3 fatty acid the body can partially convert to EPA/DHA (though conversion is limited), commonly used as a vegetarian omega-3 option.",TUDCA:"Tauroursodeoxycholic acid, a bile acid studied for supporting liver function and protecting liver cells, often used alongside compounds that place stress on the liver.","NAC (N-Acetyl Cysteine)":"A precursor to glutathione, the body's primary antioxidant, supporting liver detoxification pathways and respiratory health. Also studied for its mucus-thinning effects.","Milk Thistle (Silymarin)":"An herbal extract long used for liver support, containing silymarin, which is studied for its antioxidant and potential liver-cell-protective properties.",Glutathione:"The body's master antioxidant, involved in detoxification and protecting cells from oxidative stress. Oral absorption is debated, since glutathione is broken down during digestion, leading many to prefer liposomal forms or NAC as a precursor instead.","Alpha Lipoic Acid (ALA)":"An antioxidant that's both fat- and water-soluble, allowing it to work throughout the body. Studied for blood sugar regulation, nerve health, and regenerating other antioxidants like vitamin C and glutathione.","Dandelion Root":"An herbal supplement traditionally used to support liver and digestive function, with mild diuretic properties.","Artichoke Extract":"An herbal extract studied for supporting bile production and liver function, and sometimes used for digestive comfort.","Probiotic (Multi-Strain)":'Live beneficial bacteria intended to support gut microbiome balance, digestion, and immune function. Different strains have different researched effects, so "multi-strain" products aim for broad coverage.',"Prebiotic Fiber":"Non-digestible fiber that feeds beneficial gut bacteria, supporting a healthy microbiome. Often used alongside probiotics, which need food sources to thrive.","Digestive Enzymes":"Supplemental enzymes (like amylase, protease, and lipase) that help break down carbohydrates, proteins, and fats, often used to support digestion of foods that are otherwise hard to break down.","L-Glutamine":'An amino acid that serves as a primary fuel source for cells lining the gut, studied for supporting intestinal barrier integrity, sometimes referred to in the context of "leaky gut."',"Betaine HCL":"A supplemental source of hydrochloric acid, used to support stomach acid levels for people with low stomach acid, which can affect protein digestion and nutrient absorption.","Psyllium Husk":"A soluble fiber supplement commonly used to support regular bowel movements and digestive health, and also studied for cholesterol and blood sugar support.","Slippery Elm":"An herbal supplement that forms a soothing gel-like substance when mixed with water, traditionally used to calm digestive tract irritation.","Deglycyrrhizinated Licorice (DGL)":"A form of licorice with the compound linked to blood pressure effects removed, traditionally used to support the stomach lining and digestive comfort.","Glucosamine Sulfate":"A naturally occurring compound found in cartilage, widely used to support joint health and comfort, often paired with chondroitin.",Chondroitin:"A structural component of cartilage, commonly paired with glucosamine for joint support, though research on effectiveness is mixed.","Collagen Peptides":"Broken-down collagen protein, the main structural protein in skin, joints, tendons, and bones. Popular for skin elasticity, joint comfort, and connective tissue support.",MSM:"Methylsulfonylmethane, a sulfur-containing compound studied for joint comfort and as an anti-inflammatory, often combined with glucosamine and chondroitin.","Turmeric/Curcumin":"Curcumin is the active anti-inflammatory compound in turmeric, studied extensively for joint comfort, general inflammation, and antioxidant effects. Often paired with black pepper extract (piperine) to improve otherwise poor absorption.",Boswellia:"Also called Indian frankincense, an herbal extract studied for its anti-inflammatory effects, particularly for joint comfort.","Hyaluronic Acid":"A naturally occurring substance that retains water in joints and skin, supplemented for joint lubrication and skin hydration/elasticity.","CoQ10 (Ubiquinol)":"Ubiquinol is the active, reduced form of Coenzyme Q10, a compound essential for cellular energy production and functioning as an antioxidant. Levels decline with age, and statin medications can further reduce them.",Resveratrol:"A plant compound found in red grapes and other sources, studied for antioxidant effects and potential longevity-related cellular pathways, though human evidence for meaningful longevity benefits remains limited.",NMN:"Nicotinamide mononucleotide, a precursor the body converts into NAD+, a molecule essential for cellular energy metabolism that declines with age. Popular in longevity research contexts, though long-term human outcome data is still developing.","NR (Nicotinamide Riboside)":"Another NAD+ precursor, similar in purpose to NMN but using a different metabolic pathway to raise NAD+ levels.",PQQ:"Pyrroloquinoline quinone, a compound studied for supporting mitochondrial function and generation of new mitochondria, often paired with CoQ10.",Astaxanthin:"A potent antioxidant carotenoid, naturally found in krill and salmon, studied for skin, eye, and general antioxidant support.",Quercetin:"A plant flavonoid with antioxidant and anti-inflammatory properties, also studied for seasonal allergy support and, more recently, as a senolytic (a compound that may help clear aging cells) often paired with dasatinib in research contexts.",Pterostilbene:"A compound structurally similar to resveratrol but with better bioavailability, studied for similar antioxidant and cellular health purposes.","Lutein & Zeaxanthin":"Carotenoid antioxidants concentrated in the eye's macula, studied for supporting eye health and protecting against age-related vision decline.","Citicoline (CDP-Choline)":"A bioavailable choline source that also provides cytidine (converted to uridine), supporting brain cell membrane health and acetylcholine production. Commonly used for focus and cognitive support.","Alpha-GPC":"A highly bioavailable choline compound that crosses into the brain efficiently, widely used to support memory, focus, and acetylcholine production.","Bacopa Monnieri":"An Ayurvedic herb studied for memory and cognitive support, generally associated with gradual, cumulative benefits over weeks of consistent use rather than acute effects.",Phosphatidylserine:"A phospholipid that's a structural component of brain cell membranes, studied for supporting memory and cognitive function, particularly in the context of age-related decline.","N-Acetyl L-Tyrosine":"A more bioavailable form of the amino acid tyrosine, a precursor to dopamine and norepinephrine, sometimes used to support focus and stress resilience.","Maritime Pine Bark Extract":"Also known as Pycnogenol, an antioxidant extract studied for circulation, skin health, and cognitive support.","Ginkgo Biloba":"One of the oldest and most studied herbal supplements, traditionally used for memory and circulation support, though modern research on cognitive benefits is mixed.","Gotu Kola":"An Ayurvedic and traditional Chinese medicine herb studied for cognitive support, wound healing, and circulation.",DMAE:"Dimethylaminoethanol, a compound sometimes used for cognitive support and marketed for skin firmness, though evidence for these effects is limited.","Huperzine A":"A compound derived from Chinese club moss that inhibits the breakdown of acetylcholine, a neurotransmitter important for memory, studied for cognitive support.","Choline Citrate":"A choline source bound to citric acid, providing the essential nutrient choline in a form some find gentler on the stomach than other choline salts.",Ashwagandha:"An adaptogenic herb widely used for stress management, and studied for effects on cortisol levels, sleep, and in some research, testosterone and strength.","Rhodiola Rosea":"An adaptogenic herb traditionally used to reduce fatigue and support resilience to physical and mental stress.","Panax Ginseng":`A well-known adaptogen used for energy, cognitive function, and general vitality, distinct from American ginseng and "Siberian ginseng" (which isn't a true ginseng species).`,"Holy Basil (Tulsi)":"An adaptogenic herb from Ayurvedic tradition, used for stress support and studied for effects on cortisol and blood sugar.","Maca Root":"A Peruvian root vegetable traditionally used for energy, libido, and hormonal balance support, though it doesn't directly contain hormones itself.",Cordyceps:"A medicinal mushroom studied for exercise performance and energy, thought to work partly by supporting cellular energy (ATP) production.","Reishi Mushroom":'A medicinal mushroom used traditionally for immune support and relaxation, often referred to as the "mushroom of immortality" in traditional Chinese medicine.',"Lion's Mane Mushroom":"A medicinal mushroom studied for supporting nerve growth factor production, with associated interest in cognitive and nerve health support.",Melatonin:"A hormone the body naturally produces to regulate the sleep-wake cycle, commonly supplemented to help with sleep onset, especially for jet lag or shift work.","L-Theanine":"An amino acid found in tea, promoting calm alertness without sedation. Often used alone for relaxation and focus, or combined with caffeine to smooth out its stimulating effects.",GABA:"A calming neurotransmitter the brain produces naturally. Supplemental GABA's ability to cross the blood-brain barrier is debated, though it's still widely used for relaxation and sleep support.",Glycine:"An amino acid studied for improving sleep quality, thought to work partly by lowering core body temperature, which supports the body's natural sleep signal.",Apigenin:"A plant flavonoid, found in chamomile among other sources, studied for mild calming and sleep-supportive effects.","Valerian Root":"An herbal supplement traditionally used for sleep support and relaxation, with a long history of use as a mild sedative.","5-HTP":"A precursor to serotonin (which the body also converts to melatonin), used to support mood and sleep.","Whey Protein":"A fast-digesting, complete protein derived from milk, widely used to support muscle recovery and daily protein intake, especially around exercise.","Casein Protein":"A slow-digesting milk protein, often used before sleep to provide a steady release of amino acids overnight.","Plant Protein Blend":"A combination of plant-based protein sources (like pea, rice, or hemp) designed to provide a more complete amino acid profile than any single plant source alone, for vegan/vegetarian diets.","L-Carnitine":"An amino acid derivative involved in transporting fatty acids into cells for energy production, studied for exercise performance and fat metabolism support.","Branched-Chain Amino Acids (BCAAs)":"Leucine, isoleucine, and valine \u2014 three essential amino acids studied for muscle protein synthesis and reducing exercise-related muscle breakdown, though a complete protein source generally provides these already.","Creatine Monohydrate":"One of the most researched sports supplements, supporting rapid energy production in muscle cells. Widely used for strength, power, and muscle growth support, with some emerging research on cognitive benefits too.","Beta-Alanine":"An amino acid that buffers acid buildup in muscles during high-intensity exercise, studied for supporting performance in short, intense efforts. Commonly causes a harmless tingling sensation (paresthesia).",Taurine:"An amino acid involved in cellular hydration, electrolyte balance, and antioxidant function, commonly included in energy drinks and studied for cardiovascular and exercise support.","L-Arginine":"An amino acid that's a precursor to nitric oxide, which relaxes blood vessels, studied for circulation and exercise performance support.","L-Citrulline Malate":"Converted to arginine in the body (more efficiently, in some research, than arginine supplementation itself), supporting nitric oxide production, blood flow, and exercise performance.","Garlic Extract":"A concentrated source of garlic's active compounds, studied for cardiovascular support, including cholesterol and blood pressure.",Nattokinase:"An enzyme derived from a fermented soybean dish (natto), studied for supporting healthy blood clotting balance and circulation.","Beetroot Extract (Nitrates)":"A source of dietary nitrates, which the body converts to nitric oxide, supporting blood vessel dilation, blood pressure, and exercise performance.","Hawthorn Berry":"An herbal supplement with a long history of traditional use for cardiovascular support.","DIM (Diindolylmethane)":"A compound derived from cruciferous vegetables (like broccoli), studied for supporting healthy estrogen metabolism.","Chasteberry (Vitex Agnus-Castus)":"An herbal supplement traditionally used to support hormonal balance and menstrual cycle regularity, particularly for PMS-related symptoms.","Black Cohosh":"An herbal supplement widely used to support comfort during menopause, particularly for hot flashes.","Red Raspberry Leaf":"An herbal supplement traditionally used to support uterine health, commonly associated with use during pregnancy, though this should always be discussed with a healthcare provider.","Dong Quai":'An herb used in traditional Chinese medicine, often called "female ginseng," traditionally used to support menstrual and hormonal health.',"Saw Palmetto":"An herbal supplement widely used to support prostate health and urinary function, particularly related to benign prostatic hyperplasia (BPH).",Pygeum:"An herbal extract from African plum bark, traditionally used alongside saw palmetto for prostate and urinary support.","Tribulus Terrestris":"An herbal supplement marketed for libido and testosterone support, though most research doesn't show it meaningfully raises testosterone levels.","Horny Goat Weed":"An herbal supplement (also called Epimedium) traditionally used for libido support, containing a compound called icariin studied for its effects on blood flow.",DHEA:"A hormone precursor the body naturally produces, which can be converted into testosterone and estrogen. Levels decline with age, so it's sometimes supplemented for hormonal, libido, or anti-aging purposes.","Stinging Nettle Root Extract":"An herbal extract studied alongside saw palmetto for prostate and urinary support.","Beta-Sitosterol":"A plant sterol studied for prostate and urinary health support, often included in prostate-focused supplement blends.","Pumpkin Seed Oil":"A source of beneficial fatty acids and phytosterols, traditionally used to support prostate and urinary health.",Keratin:"A structural protein that makes up hair, skin, and nails, supplemented to support their strength and appearance.",Silica:"A trace mineral involved in collagen formation, commonly supplemented for hair, skin, and nail health.","Marine Collagen":"Collagen derived from fish sources, with a smaller peptide size than other collagen sources, which some suggest may improve absorption. Used for skin, hair, and joint support.",Multivitamin:"A combination supplement covering a broad range of essential vitamins and minerals, intended as general nutritional insurance against dietary gaps.","Electrolyte Blend":"A combination of minerals like sodium, potassium, and magnesium, used to support hydration, especially around exercise or heat exposure.","Green Superfood Blend":"A powdered combination of vegetables, algae, and other plant-based ingredients, marketed as a convenient way to boost micronutrient and antioxidant intake.","Apple Cider Vinegar":"Fermented apple juice, popularly used for digestive support and marketed for blood sugar and weight management, though evidence for these specific claims is limited.",Spirulina:"A blue-green algae rich in protein, antioxidants, and micronutrients, used as a general nutritional supplement.",Chlorella:"A green algae supplement similar to spirulina, also studied for detoxification support due to its ability to bind certain heavy metals.",Colostrum:"The nutrient-rich first milk produced by mammals after birth, supplemented for its immune-supportive antibodies and growth factors.",Elderberry:"A berry extract widely used to support immune function, particularly at the onset of cold and flu symptoms.",Lycopene:"A carotenoid antioxidant, most concentrated in tomatoes, studied for prostate health and general antioxidant support."},tC={};Object.entries(u2).forEach(([a,e])=>{tC[Wt(a)]=e});function c2(a){return tC[Wt(a.name)]||null}var Lg={Chest:["Bench Press (Barbell)","Bench Press (Dumbbell)","Incline Bench Press (Barbell)","Incline Bench Press (Dumbbell)","Decline Bench Press","Chest Fly (Dumbbell)","Cable Crossover","Push-Up","Dips (Chest)","Machine Chest Press"],Back:["Deadlift (Barbell
